<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Customers API 테스트</title>
    <style>
        body { font-family: sans-serif; margin: 30px; max-width: 600px; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        h3 { margin-top: 0; }
        input, textarea { padding: 6px; font-size: 14px; }
        button { padding: 6px 12px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <h2>Customers API 테스트</h2>

    <!-- 1. 전체 목록 조회 -->
    <div class="box">
        <h3>1. 전체 조회 (GET /customers)</h3>
        <button onclick="getAllCustomers()">전체 목록 가져오기</button>
    </div>

    <!-- 2. 단건 조회 -->
    <div class="box">
        <h3>2. 단건 조회 (GET /customers/{id})</h3>
        <input type="number" id="customerId" placeholder="ID 입력 (예: 1)" style="width: 150px;">
        <button onclick="getCustomerById()">ID로 조회</button>
    </div>

    <!-- 3. 신규 등록 -->
    <div class="box">
        <h3>3. 고객 등록 (POST /customers)</h3>
        <!-- 본인의 Customer DTO 필드명에 맞게 수정하세요 -->
        <textarea id="postBody" rows="4" style="width: 95%;">{"id": 1, "name": "홍길동", "email": "hong@example.com"}</textarea><br><br>
        <button onclick="createCustomer()">POST 전송</button>
    </div>

    <!-- 응답 결과 출력 -->
    <h3>응답 결과:</h3>
    <pre id="result">여기에 결과가 표시됩니다.</pre>

    <script>
        const resultArea = document.getElementById('result');

        // 응답을 예쁘게 출력하는 공통 함수
        async function handleResponse(response) {
            const text = await response.text();
            try {
                // 응답이 JSON이면 보기 좋게 들여쓰기 적용
                const json = JSON.parse(text);
                resultArea.textContent = `[상태코드: ${response.status}]\n` + JSON.stringify(json, null, 2);
            } catch {
                // 일반 텍스트일 경우 그대로 출력
                resultArea.textContent = `[상태코드: ${response.status}]\n` + text;
            }
        }

        // 1. GET /customers
        async function getAllCustomers() {
            try {
                const response = await fetch('/customers');
                await handleResponse(response);
            } catch (error) {
                resultArea.textContent = '에러 발생: ' + error;
            }
        }

        // 2. GET /customers/{id}
        async function getCustomerById() {
            const id = document.getElementById('customerId').value;
            if (!id) {
                alert('조회할 숫자 ID를 입력하세요.');
                return;
            }

            try {
                const response = await fetch(`/customers/${id}`);
                await handleResponse(response);
            } catch (error) {
                resultArea.textContent = '에러 발생: ' + error;
            }
        }

        // 3. POST /customers
        async function createCustomer() {
            const bodyData = document.getElementById('postBody').value;

            try {
                const response = await fetch('/customers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: bodyData
                });
                await handleResponse(response);
            } catch (error) {
                resultArea.textContent = '에러 발생: ' + error;
            }
        }
    </script>
</body>
</html>
